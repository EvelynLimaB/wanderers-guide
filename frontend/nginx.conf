# Wanderer's Guide frontend nginx.
#
# Supabase is hosted outside this container. The browser receives the
# VITE_SUPABASE_URL value baked into the Vite bundle and talks to that endpoint
# directly. This nginx only serves the SPA.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/, /characters, /auth/patreon/redirect, /sheet/:id...)
    # fall through to index.html. Supabase API requests do not pass through
    # this nginx server because the app talks to the configured external URL.
    location / {
        try_files $uri $uri/ /index.html;
    }


    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
