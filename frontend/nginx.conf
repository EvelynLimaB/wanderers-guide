# Wanderer's Guide frontend nginx.
#
# Supabase is hosted outside this container. The browser receives the
# VITE_SUPABASE_URL value baked into the Vite bundle and talks to that endpoint
# directly. This nginx only serves the SPA.

# Limit expensive browser automation calls at the edge, before allocating a Chromium context.
limit_req_zone $binary_remote_addr zone=pathbuilder_derive:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/, /characters, /auth/patreon/redirect, /sheet/:id...)
    # fall through to index.html. Supabase API requests do not pass through
    # this nginx server because the app talks to the configured external URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-side Pathbuilder export runs in an internal container. Its port is not published.
    location = /api/pathbuilder/derive {
        limit_req zone=pathbuilder_derive burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://pathbuilder-automation:8080/derive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
