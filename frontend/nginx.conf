# Wanderer's Guide frontend nginx.
#
# Serves the built Vite bundle AND reverse-proxies the Supabase API prefixes to
# kong, so the whole app is same-origin behind a single hostname (Tailscale
# Serve, Caddy, whatever terminates TLS). Same-origin means no CORS preflights
# and only one URL to bake into the bundle: VITE_SUPABASE_URL == the site origin.
#
# This file is included inside nginx's `http {}` block (conf.d/*.conf), so the
# `map` directives below are valid here.

# WebSocket upgrade handling (realtime is not deployed in this stack, but the
# header must not be hardcoded to "upgrade" for ordinary requests).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The TLS terminator (Tailscale Serve) sends X-Forwarded-Proto: https. Pass it
# through untouched; only fall back to our own scheme for plain-HTTP requests.
# GoTrue uses this header to build absolute redirect URLs; overwriting it with
# "http" is what produces http:// links inside an https:// app.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # storage's FILE_SIZE_LIMIT is 50 MB in docker-compose.yml; leave headroom.
    client_max_body_size 60m;

    # --- reverse-proxy defaults, inherited by the locations below ---
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # Edge functions can run long (content searches); don't cut them off at 60s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    # Stream large storage uploads instead of spooling them to disk.
    proxy_request_buffering off;

    # --- Supabase API -> kong -------------------------------------------------
    # IMPORTANT: no trailing slash or URI on proxy_pass. kong's routes match on
    # /auth/v1/, /rest/v1/, ... and strip that prefix themselves
    # (strip_path: true in docker/kong.yml). Rewriting the URI here would make
    # every single API route 404.
    location ~ ^/(auth|rest|storage|functions|realtime)/v1/ {
        proxy_pass http://kong:8000;
    }

    # postgres-meta, consumed by Studio. kong gates it behind service_role.
    location /pg/ {
        proxy_pass http://kong:8000;
    }

    # --- static SPA -----------------------------------------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/, /characters, /auth/patreon/redirect, /sheet/:id...)
    # all fall through to index.html. The API regex above is anchored on
    # "/v1/", so it does not shadow the /auth/patreon/redirect UI route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
