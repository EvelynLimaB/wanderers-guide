name: Pathbuilder import parity

on:
  pull_request:
    paths:
      - "frontend/src/process/import/pathbuilder/**"
      - "frontend/src/schemas/pathbuilder.ts"
      - "frontend/scripts/pathbuilder-*.test.mjs"
      - "frontend/scripts/pathbuilder-base-weapon.test.mjs"
      - "frontend/scripts/operation-test-harness.mjs"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/pathbuilder-import-parity.yml"

permissions:
  contents: read

jobs:
  pathbuilder-import:
    name: Pathbuilder import regression and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      # Compile-only placeholders. Tests mock all request/content boundaries;
      # this workflow must never connect to a real Supabase project.
      VITE_SUPABASE_URL: https://supabase.invalid
      VITE_SUPABASE_KEY: pathbuilder-import-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Pathbuilder import parity tests
        run: npm run test:pathbuilder-import

      - name: Build frontend
        run: npm run build
